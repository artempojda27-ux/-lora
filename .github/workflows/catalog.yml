# Автооновлення каталогу ÉLORA: кожні 3 години тягне свіжі фіди TAPULI, 4cases і Podium,
# докачує нові фото, прибирає розпродане і комітить у main — Vercel сам передеплоїть.
# Запуск вручну: вкладка Actions → «Оновлення каталогу» → Run workflow, або кнопка в /admin.
name: Оновлення каталогу

on:
  schedule:
    - cron: '17 */3 * * *'   # кожні 3 години (о :17), щоб розпродане швидко зникало з вітрини
  workflow_dispatch:
    inputs:
      markup:
        description: 'Націнка для цін 4cases (1 — як на сайті 4cases, 1.6 — +60%)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: elora-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Модель для єдиного фону фото
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-isnet-general-use

      - name: Залежності
        run: pip install --quiet Pillow "rembg[cpu]" beautifulsoup4

      - name: Взуття (TAPULI)
        id: tapuli
        continue-on-error: true
        run: |
          python3 import_tapuli.py
          python3 check_catalog.py data/catalog.js DATA

      - name: Відкат взуття при помилці
        if: steps.tapuli.outcome == 'failure'
        run: |
          git checkout -- data/catalog.js img/tp
          git clean -fdq img/tp

      - name: Сумки та аксесуари (4cases)
        id: fourcases
        continue-on-error: true
        env:
          MARKUP: ${{ github.event.inputs.markup || vars.MARKUP_4CASES || '1' }}
        run: |
          python3 import_4cases.py --markup "$MARKUP"
          python3 check_catalog.py data/4cases.js DATA_4C

      - name: Відкат 4cases при помилці
        if: steps.fourcases.outcome == 'failure'
        run: |
          git checkout -- data/4cases.js img/4c
          git clean -fdq img/4c

      - name: Сумки та аксесуари (Podium)
        id: podium
        continue-on-error: true
        env:
          PODIUM_FEED: ${{ secrets.PODIUM_FEED_URL }}
        run: |
          if [ -n "$PODIUM_FEED" ]; then python3 import_podium.py --feed "$PODIUM_FEED"; else python3 import_podium.py; fi
          python3 check_catalog.py data/podium.js DATA_PD --min-count 20

      - name: Відкат Podium при помилці
        if: steps.podium.outcome == 'failure'
        run: |
          git checkout -- data/podium.js img/pd
          git clean -fdq img/pd

      - name: Telegram-канали постачальників
        id: tg
        continue-on-error: true
        run: |
          python3 import_tg.py --days 21 --pages 15
          python3 check_catalog.py data/tg.js DATA_TG --min-count 30

      - name: Відкат Telegram при помилці
        if: steps.tg.outcome == 'failure'
        run: |
          git checkout -- data/tg.js img/tg
          git clean -fdq img/tg

      - name: Коміт змін
        run: |
          git add -A data img
          if git diff --cached --quiet; then
            echo "Каталог не змінився"
            exit 0
          fi
          git config user.name "elora-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Каталог: автооновлення $(date -u +%Y-%m-%d)" \
            -m "$(git diff --cached --stat -- data | tail -1)"
          git push origin HEAD:main
          # нагадування в Telegram: що закінчується в постачальників і що зникло (до деплою нової версії)
          # основний домен — elora-shoes.com; якщо він недоступний, той самий сайт на lora-zeta.vercel.app
          curl -sSf -m 60 -X POST https://elora-shoes.com/api/stock-alerts \
            || curl -sS -m 60 -X POST https://lora-zeta.vercel.app/api/stock-alerts || true

      - name: Розбудити пости в Telegram-канал
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # якщо цикл публікацій уже йде — новий запуск стане в чергу й продовжить після нього
          gh workflow run tg-post.yml --ref main || true

      - name: Підсумок
        if: always()
        run: |
          {
            echo "### Оновлення каталогу"
            echo "- Взуття (TAPULI): ${{ steps.tapuli.outcome }}"
            echo "- Сумки (4cases): ${{ steps.fourcases.outcome }}"
            echo "- Сумки (Podium): ${{ steps.podium.outcome }}"
            echo "- Telegram-канали: ${{ steps.tg.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tapuli.outcome }}" = failure ] || [ "${{ steps.fourcases.outcome }}" = failure ] || [ "${{ steps.podium.outcome }}" = failure ] || [ "${{ steps.tg.outcome }}" = failure ]; then
            echo "::warning::Одне з джерел не оновилось — на сайті лишилась попередня версія цього розділу"
          fi
