# Пости в Telegram-канал магазину: кожні 30 хв удень — один товар із Telegram-постачальників
# (новинки першими, решта поступово). Публікує сайт (/api/tg-post) — токен бота лише у Vercel,
# а GitHub підтверджує запит своїм OIDC-підписом. Що вже опубліковано — у гілці tg-state.
name: Пости в Telegram-канал

on:
  schedule:
    - cron: '7,37 5-19 * * *'   # UTC ≈ 8:00–22:00 за Києвом; нічну паузу перевіряє й сам скрипт
  workflow_dispatch:
    inputs:
      n:
        description: 'Скільки постів опублікувати зараз'
        required: false
        default: '1'

permissions:
  contents: write
  id-token: write

concurrency:
  group: tg-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Стан публікацій
        uses: actions/checkout@v4
        with:
          ref: tg-state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet Pillow

      - name: Публікація
        working-directory: elora-deploy
        run: python3 tools/post_tg.py --state ../state/posted.json --n "${{ github.event.inputs.n || '1' }}"

      - name: Зберегти стан
        working-directory: state
        run: |
          git add posted.json
          git diff --cached --quiet && exit 0
          git config user.name "elora-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "tg: опубліковано $(python3 -c "import json;print(len(json.load(open('posted.json'))['posted']))")"
          git push origin HEAD:tg-state
